name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./internal/...

  build-linux:
    needs: test
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    container: golang:1.26-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/ci-build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: model-quota-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  build-native:
    needs: test
    strategy:
      matrix:
        include:
          - { runner: macos-latest, os: darwin, arch: amd64 }
          - { runner: macos-latest, os: darwin, arch: arm64 }
          - { runner: windows-latest, os: windows, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: sh scripts/ci-build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: model-quota-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package Release Assets
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir dist
          for dir in artifacts/model-quota-*; do
            platform=${dir#artifacts/model-quota-}
            os_name=${platform%-*}
            arch_name=${platform##*-}
            zip -j -q "dist/model-quota_${VERSION}_${os_name}_${arch_name}.zip" "$dir"/*
          done
          cd dist
          sha256sum *.zip > checksums.txt
          cat checksums.txt
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Model Quota $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
