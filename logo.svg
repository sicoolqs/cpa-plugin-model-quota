<svg viewBox="0 0 128 128" width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b66f5" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Rounded Card -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />
  <!-- Speedometer / Gauge Arc -->
  <path d="M34 82 A 38 38 0 1 1 94 82" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="8" stroke-linecap="round" />
  <path d="M34 82 A 38 38 0 0 1 84 46" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <!-- Gauge Needle Pointer -->
  <circle cx="64" cy="72" r="7" fill="#ffffff" />
  <line x1="64" y1="72" x2="80" y2="52" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <!-- Quota Indicator Dots -->
  <circle cx="42" cy="94" r="4" fill="#38bdf8" />
  <circle cx="64" cy="94" r="4" fill="#60a5fa" />
  <circle cx="86" cy="94" r="4" fill="#93c5fd" />
</svg>
